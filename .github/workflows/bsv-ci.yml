            scripts/ci-run-node-test-shard.mts
            scripts/lib/ci-node-test-groups-codec.mts
            scripts/lib/direct-run.mjs
            scripts/lib/local-check-runtime.mts
            scripts/lib/managed-child-process.mts
            scripts/lib/managed-cleanup-handoff.mts
            scripts/lib/numeric-options.mjs
            scripts/lib/vitest-outcome.mts
            scripts/lib/vitest-plan-scheduling.mts
            scripts/lib/vitest-local-scheduling.mts
            scripts/lib/vitest-resource-ownership.mts
            scripts/lib/windows-taskkill.mjs
            scripts/windows-cmd-helpers.mjs
            scripts/lib/arg-utils.mts
            scripts/lib/arg-utils.runtime.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build Node test runtime
        id: node-test-runtime
        if: matrix.pretest_build_mode != null
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_BUILD_PRIVATE_QA: ${{ matrix.pretest_build_mode == 'private-qa' && '1' || '0' }}
          VITEST: "1"
        run: pnpm build qaRuntime

      - name: Install ripgrep for native grep tests
        if: matrix.requires_ripgrep == true && runner.os == 'Linux'
        uses: ./.ci-harness/.github/actions/setup-ripgrep

      - name: Prepare Docker sandbox image
        if: matrix.requires_sandbox_image == true && runner.os == 'Linux'
        shell: bash
        run: |
          if ! docker image inspect openclaw-sandbox:trixie-slim >/dev/null 2>&1; then
            scripts/sandbox-setup.sh
          fi

      - name: Configure Node test resources
        env:
          PREDICTED_TEST_SECONDS: ${{ matrix.predicted_seconds || '' }}
          SHARD_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency || '' }}
          OPENCLAW_NODE_TEST_CPU_BUDGET: ${{ needs.preflight.outputs.effective_runner_backend == 'boat' && github.run_attempt == 1 && matrix.cpu_budget || '' }}
          FROZEN_TARGET: ${{ needs.preflight.outputs.frozen_target }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNSON_JOB: ${{ (matrix.runner == 'runson-c8i-8xlarge' || startsWith(matrix.check_name, 'checks-node-runson-cron-')) && 'true' || 'false' }}
        run: |
          actual_cores="$(nproc)"
          cores="$actual_cores"
          if [[ -n "$OPENCLAW_NODE_TEST_CPU_BUDGET" && "$cores" -gt "$OPENCLAW_NODE_TEST_CPU_BUDGET" ]]; then
            cores="$OPENCLAW_NODE_TEST_CPU_BUDGET"
          fi
          echo "OPENCLAW_NODE_TEST_CPU_BUDGET=$OPENCLAW_NODE_TEST_CPU_BUDGET" >> "$GITHUB_ENV"
          if [ "$RUNSON_JOB" = "true" ]; then
            workers=2
          elif [ "$SHARD_PLAN_CONCURRENCY" != "1" ]; then
            workers=2
          elif [ "$cores" -ge 12 ]; then
            workers=6
          elif [ "$cores" -ge 6 ]; then
            workers=4
          else
            workers=3
          fi
          if [[ "$RUNSON_JOB" != "true" && "$RUNNER_ENVIRONMENT" == "self-hosted" && "$FROZEN_TARGET" != "true" && "$SHARD_PLAN_CONCURRENCY" == "1" ]]; then
            workers="$(CI_LEGACY_WORKERS="$workers" node --input-type=module <<'JS'
          import { isConstrainedCiCheckHost } from './scripts/lib/local-check-runtime.mts';
          import { detectVitestHostInfo, resolveLocalVitestScheduling } from './scripts/lib/vitest-local-scheduling.mts';
          const host = detectVitestHostInfo();
          if (process.env.OPENCLAW_NODE_TEST_CPU_BUDGET) {
            host.cpuCount = Math.min(host.cpuCount, Number(process.env.OPENCLAW_NODE_TEST_CPU_BUDGET));
          }
          const constrained = isConstrainedCiCheckHost({
            logicalCpuCount: host.cpuCount,
            totalMemoryBytes: host.totalMemoryBytes,
          });
          console.log(String(constrained ? process.env.CI_LEGACY_WORKERS : resolveLocalVitestScheduling(process.env, host).maxWorkers));
          JS
            )"
          fi
          if [ "$workers" -gt "$cores" ]; then
            workers="$cores"
          fi
          echo "detected cores=$actual_cores budgeted cores=$cores plan_concurrency=${SHARD_PLAN_CONCURRENCY:-default} predicted_test_seconds=${PREDICTED_TEST_SECONDS:-unknown} -> workers=$workers"
          echo "OPENCLAW_VITEST_MAX_WORKERS=$workers" >> "$GITHUB_ENV"

      - name: Resolve pooled Node test groups
        id: node-test-groups
        if: matrix.groups_pool
        env:
          GROUP_POOL: ${{ fromJSON(needs.preflight.outputs.node_test_group_pools_json)[matrix.groups_pool] }}
          GROUP_INDEX: ${{ matrix.groups_index }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { decodeNodeTestGroups, encodeNodeTestGroups } from './scripts/lib/ci-node-test-groups-codec.mts';
          const groups = decodeNodeTestGroups(process.env.GROUP_POOL)[Number(process.env.GROUP_INDEX)];
          if (!Array.isArray(groups)) {
            throw new Error('Node test group pool does not contain the selected row');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `groups_gzip_base64=${encodeNodeTestGroups(groups)}\n`);
          JS

      - name: Download adaptive CI priors
        if: ${{ github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && matrix.adaptive_observations == true && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && endsWith(github.run_id, '0'))) }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-adaptive-priors-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts

      - name: Run Node test shard
        env:
          BOAT_TEST_RUNNER: ${{ github.run_attempt == 1 && startsWith(matrix.runner_label || matrix.runner, 'boat') }}
          CHECKOUT_BASE_SHA: ${{ needs.preflight.outputs.diff_base_revision }}
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCLAW_CI_TEST_OBSERVATIONS_DIR: ${{ github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && endsWith(github.run_id, '0'))) && format('{0}/ci-test-observations', runner.temp) || '' }}
          OPENCLAW_E2E_USE_PREBUILT_DIST: ${{ steps.node-test-runtime.outcome == 'success' && matrix.pretest_build_mode == 'private-qa' && '1' || '' }}
          OPENCLAW_CI_TEST_RUNTIME_POLICY: ${{ matrix.test_runtime_policy || 'node' }}
          FROZEN_TARGET: ${{ needs.preflight.outputs.frozen_target }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ${{ matrix.groups_pool && steps.node-test-groups.outputs.groups_gzip_base64 || matrix.groups_gzip_base64 || '' }}
          OPENCLAW_NODE_TEST_GROUPS_JSON: ${{ matrix.groups && toJson(matrix.groups) || '' }}
          OPENCLAW_NODE_TEST_CONFIGS_JSON: ${{ toJson(matrix.configs) }}
          OPENCLAW_NODE_TEST_ENV_JSON: ${{ toJson(matrix.env) }}
          OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: ${{ toJson(matrix.includePatterns) }}
          OPENCLAW_NODE_TEST_TARGETS_JSON: ${{ toJson(matrix.targets) }}
          # Keep the watchdog above Vitest so frozen hook diagnostics finish.
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: ${{ needs.preflight.outputs.compatibility_target == 'true' && '["--hookTimeout=600000"]' || '[]' }}
          OPENCLAW_VITEST_SHARD_NAME: ${{ matrix.shard_name }}
          OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: ${{ needs.preflight.outputs.compatibility_target == 'true' && '660000' || '300000' }}
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: ${{ matrix.plan_concurrency }}
        shell: bash
        run: |
          set -euo pipefail
          runner="scripts/ci-run-node-test-shard.mts"
          if [[ ! -f "$runner" ]]; then
            runner=".ci-workflow/${runner}"
            [[ -f "$runner" ]]
          fi
          prefix=()
          if [[ "$BOAT_TEST_RUNNER" == "true" ]]; then
            # Boat CI runners inherit read/search bypass; tests need ordinary Unix permissions.
            prefix=(setpriv --inh-caps=-dac_read_search --ambient-caps=-dac_read_search)
          fi
          time -p "${prefix[@]}" node --import tsx "$runner"

      - name: Upload adaptive CI observations
        if: ${{ always() && github.repository == 'openclaw/openclaw' && needs.preflight.outputs.frozen_target == 'false' && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && endsWith(github.run_id, '0'))) }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-observations-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/ci-test-observations/*/observations.json
            ${{ runner.temp }}/ci-test-observations/*/launch.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record runner memory peak
        if: always()
        shell: bash
        run: |
          # Absolute high-water mark for the runner cgroup and its descendants, including setup.
          if ! node --input-type=module <<'NODE'
          try {
            const { readProcessCgroupV2Snapshot } = await import("./.ci-harness/scripts/lib/process-memory.mts");
            const peak = readProcessCgroupV2Snapshot()?.[0]?.counters["memory.peak"]?.trim();
            console.log(/^\d+$/.test(peak ?? "")
              ? `runner cgroup peak memory bytes=${peak}`
              : "runner cgroup peak memory unavailable");
          } catch {
            console.log("runner cgroup peak memory unavailable");
          }
          NODE
          then
            echo "runner cgroup peak memory unavailable"
          fi

      - name: Save docs i18n Go cache
        if: always() && matrix.requires_go == true && needs.preflight.outputs.cache_write_allowed == 'true' && steps.docs-i18n-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.docs-i18n-go-cache-key.outputs.paths }}
          key: ${{ steps.docs-i18n-go-cache.outputs.cache-primary-key }}


  ci-gate:
    name: bsv/ci-gate
    needs: [preflight, checks-node-core-test-nondist-shard]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          NODE: ${{ needs.checks-node-core-test-nondist-shard.result }}
        run: |
          echo "preflight=$PREFLIGHT checks-node=$NODE BSV_MODE=$BSV_MODE"
          test "$PREFLIGHT" = success && test "$NODE" = success
