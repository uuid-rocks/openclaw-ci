          native-secret-service: ${{ matrix.requires_native_secret_service == true && 'true' || 'false' }}
          install-bun: "false"
          # Only Node 24 consumes the trusted compile seed.
          dependency-cache: ${{ needs.preflight.outputs.dependency_cache }}
          vitest-fs-cache: "true"
          vitest-worker-cache: ${{ needs.preflight.outputs.frozen_target != 'true' && matrix.pretest_build_mode == null && (matrix.node_version == null || matrix.node_version == '24.x') && 'true' || 'false' }}
          vitest-worker-preset: ${{ matrix.worker_cache_preset || 'full' }}
          node-compile-cache: "true"

