# Measurement copy of openclaw's scheduled (main-shape) node test matrix for
# @useblacksmith/vitest. Generated by gen-workflow.py from ci.yml; see
# /home/jh/.local/state/bsv/recheck/results/openclaw-harness.md.
name: bsv-ci

on:
  push:
    branches: ["bsvm/**"]

permissions:
  contents: read

concurrency:
  group: bsv-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"
  OPENCLAW_TYPECHECKER: ""
  BSV_MODE: ${{ contains(github.ref_name, '/select') && 'select' || (contains(github.ref_name, '/shadow') && 'shadow' || (contains(github.ref_name, '/runall') && 'runall' || 'off')) }}

jobs:
  seed:
    if: ${{ contains(github.event.head_commit.message, '[bsv-seed]') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node environment
        id: setup-node-env
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: read-write
          dependency-cache: "true"
          install-bun: "false"
      - name: Save Node toolchain cache
        if: ${{ steps.setup-node-env.outputs.node-toolchain-populated == 'true' && steps.setup-node-env.outputs.node-toolchain-cache-matched-key != steps.setup-node-env.outputs.node-toolchain-cache-key }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-node-env.outputs.node-toolchain-cache-path }}
          key: ${{ steps.setup-node-env.outputs.node-toolchain-cache-key }}
      - name: Save exact dependency cache
        if: ${{ steps.setup-node-env.outputs.dependency-cache-key != '' && steps.setup-node-env.outputs.dependency-cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            ui/node_modules
            packages/*/node_modules
            extensions/*/node_modules
            examples/*/node_modules
            .cache/openclaw-pnpm-store
          key: ${{ steps.setup-node-env.outputs.dependency-cache-key }}
      - name: Save pnpm store cache
        if: ${{ steps.setup-node-env.outputs.pnpm-store-cache-key != '' && steps.setup-node-env.outputs.pnpm-store-cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-node-env.outputs.pnpm-store-cache-path }}
          key: ${{ steps.setup-node-env.outputs.pnpm-store-cache-key }}
      - name: Warm pinned Bun release assets
        uses: ./.github/actions/setup-test-bun
        with:
          cache-mode: read-write

  preflight:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      checkout_revision: ${{ github.sha }}
      diff_base_revision: ${{ github.event.before }}
      cache_mode: restore
      cache_write_allowed: "true"
      dependency_cache: "true"
      ci_qualification: "false"
      effective_runner_backend: hybrid
      node_runner_backend: hybrid
      placement_runner_backend: hybrid
      runner_profile: hybrid
      frozen_target: ${{ steps.manifest.outputs.frozen_target }}
      compatibility_target: ${{ steps.manifest.outputs.compatibility_target }}
      run_checks_node_core_nondist: ${{ steps.manifest.outputs.run_checks_node_core_nondist }}
      checks_node_core_nondist_matrix: ${{ steps.manifest.outputs.checks_node_core_nondist_matrix }}
      node_test_group_pools_json: ${{ steps.manifest.outputs.node_test_group_pools_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Build CI manifest (scheduled main shape)
        id: manifest
        env:
          OPENCLAW_CI_CHECKOUT_REVISION: ${{ github.sha }}
          OPENCLAW_CI_WORKFLOW_REVISION: ${{ github.sha }}
          OPENCLAW_CI_CHANGED_BASE: ${{ github.sha }}
          OPENCLAW_CI_EVENT_NAME: "schedule"
          OPENCLAW_CI_REPOSITORY: "openclaw/openclaw"
          OPENCLAW_CI_DOCS_ONLY: "false"
          OPENCLAW_CI_DOCS_CHANGED: "true"
          OPENCLAW_CI_RUN_NODE: "true"
          OPENCLAW_CI_RUN_MACOS: "true"
          OPENCLAW_CI_RUN_MACOS_NODE: "true"
          OPENCLAW_CI_RUN_IOS_BUILD: "true"
          OPENCLAW_CI_RUN_ANDROID: "true"
          OPENCLAW_CI_RUN_WINDOWS: "true"
          OPENCLAW_CI_RUN_SKILLS_PYTHON: "true"
          OPENCLAW_CI_RUN_CONTROL_UI_I18N: "true"
          OPENCLAW_CI_RUN_UI_TESTS: "true"
          OPENCLAW_CI_RUN_NATIVE_I18N: "true"
          OPENCLAW_CI_VALIDATION_TIER: "main"
          OPENCLAW_CI_RELEASE_SCOPE: "full"
          OPENCLAW_CI_RELEASE_GATE: "false"
          OPENCLAW_CI_RUNNER_PROFILE: "hybrid"
          OPENCLAW_CI_NODE_RUNNER_BACKEND: "hybrid"
          OPENCLAW_CI_QUALIFICATION: "false"
          OPENCLAW_CI_SHAPE: "default"
          OPENCLAW_CI_RUNNER_BACKEND: "hybrid"
          OPENCLAW_CI_EFFECTIVE_RUNNER_BACKEND: "hybrid"
          OPENCLAW_CI_HOSTED_HEALTHY: "true"
          OPENCLAW_CI_HISTORICAL_TARGET: "false"
          OPENCLAW_CI_RELEASE_CANDIDATE_TARGET: "false"
          OPENCLAW_CI_TARGET_CONTEXT_TARGET: "false"
          OPENCLAW_CI_CHANGED_PATHS_JSON: "null"
          OPENCLAW_CI_FULL: "false"
        run: |
          set -euo pipefail
          echo "BSV_MODE=$BSV_MODE"
          node scripts/ci-build-manifest.mjs
          node .github/bsv/drop-git-prereqs.mjs
          grep '^checks_node_core_nondist_matrix=' "$GITHUB_OUTPUT" | sed 's/^[^=]*=//' | node -e 'const m=JSON.parse(require("fs").readFileSync(0,"utf8"));const c={};for(const r of m.include){const k=r.runner_label||r.runner;c[k]=(c[k]||0)+1};console.log("node matrix rows="+m.include.length+" "+JSON.stringify(c))'

  checks-node-core-test-nondist-shard:
    permissions:
      contents: read
    env:
      CHECKOUT_GIT_COMMITS_JSON: ${{ toJson(matrix.git_commits) }}
    name: ${{ matrix.check_name || 'checks-node-core-test-nondist-shard' }}
    needs: [preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.run_checks_node_core_nondist == 'true' }}
    runs-on: ${{ (matrix.runner == 'blacksmith-8vcpu-ubuntu-2404' && contains(fromJSON('["checks-node-compact-large-9","checks-node-compact-large-5"]'), matrix.check_name)) && 'blacksmith-4vcpu-ubuntu-2404' || matrix.runner_label || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && github.repository == 'openclaw/openclaw' && github.run_attempt == 1 && needs.preflight.outputs.frozen_target != 'true' && contains(fromJSON('["blacksmith","hybrid","boat"]'), needs.preflight.outputs.node_runner_backend) && contains(fromJSON('["","blacksmith","hybrid"]'), (github.run_attempt != 1 && (needs.preflight.outputs.ci_qualification == 'true' || needs.preflight.outputs.effective_runner_backend == 'boat') && 'github' || needs.preflight.outputs.placement_runner_backend)) && 130 || 96 }}
      matrix: ${{ fromJson(needs.preflight.outputs.checks_node_core_nondist_matrix) }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REPO: ${{ github.repository }}
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ needs.preflight.outputs.checkout_revision }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python_command=python3
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_command=python
          fi
          run_owner() {
            if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "Windows" ]; then
              # Keep trusted code outside the checkout and below Windows argv limits.
              printf '%s' "$1" > "$RUNNER_TEMP/ci-git-owner.py"
              exec "$python_command" -I -S "$RUNNER_TEMP/ci-git-owner.py"
            fi
            exec "$python_command" -I -S -c "$1"
          }
